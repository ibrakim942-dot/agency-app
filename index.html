<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Агентство блогеров</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: премиальный пульт агентства — строгий, дорогой, спокойный
   IDEA: приватный банковский счёт: чёрная карта, золотые волосяные линии
   PICTURE: карта «Маржа» с золотой цифрой и тонкой линией цели
   COLOUR and TYPE: чёрный и графит, золото как единственный акцент; Manrope 300 для цифр
   LAYOUT: одна колонка, плавающая нижняя панель, формы в листе снизу с чипами вместо списков */
:root{
  --bg:#f2f1ee;--card:#fff;--ink:#17150f;--hint:#7a756c;--line:rgba(23,21,15,.08);
  --acc:#ff5a36;--acc-ink:#fff;--acc-soft:rgba(255,90,54,.12);
  --green:#169c55;--green-soft:rgba(22,156,85,.12);--amber:#c47a00;--amber-soft:rgba(196,122,0,.13);
  --red:#e0383e;--red-soft:rgba(224,56,62,.12);--blue:#3b6cff;--blue-soft:rgba(59,108,255,.12);
  --hero:#1b1915;--hero-ink:#f6f2ea;--hero-hint:#a49d91;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0f0e0d;--card:#1b1a18;--ink:#f3efe8;--hint:#968f85;--line:rgba(255,255,255,.07);
  --acc:#ff6b4a;--acc-soft:rgba(255,107,74,.16);--green:#34c472;--green-soft:rgba(52,196,114,.15);
  --amber:#e9a23b;--amber-soft:rgba(233,162,59,.15);--red:#ff5a5f;--red-soft:rgba(255,90,95,.15);
  --blue:#6e91ff;--blue-soft:rgba(110,145,255,.16);--hero:#24211d;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:640px;margin:0 auto;padding:14px 14px 24px}
.top{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.top .t1{font-weight:800;font-size:18px;line-height:1.1}
.top .t2{color:var(--hint);font-size:13px}
h1{font-size:26px;line-height:1.1;font-weight:800;margin:6px 2px 14px;letter-spacing:-.01em}
h1 .s{font-size:15px;font-weight:600}
h2{font-size:13px;font-weight:700;color:var(--hint);margin:22px 4px 8px}
.banner{background:var(--amber-soft);color:var(--ink);border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:13px}
.banner.err{background:var(--red-soft)}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.list .card{cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:transform .12s}
.list .card:active{transform:scale(.985)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:var(--blue-soft);color:var(--blue)}
.av.food{background:var(--acc-soft);color:var(--acc)}
.av.cl{border-radius:12px;background:var(--line);color:var(--ink)}
.grow{flex:1}
.row{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.t{font-weight:700}
.s{color:var(--hint);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--line);white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 18px 16px;display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;align-items:center;margin-bottom:10px}
.hero .lbl{color:var(--hero-hint);font-size:13px;font-weight:600}
.hero b{display:block;font-size:clamp(26px,8vw,34px);line-height:1.05;font-weight:800;margin:6px 0 8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .sub{color:var(--hero-hint);font-size:13px}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px}
.kpi .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.kpi b{display:block;font-size:26px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums}
.todo{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.todo:first-child{border-top:0;padding-top:2px}
.todo:last-child{padding-bottom:2px}
.ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--red-soft);color:var(--red)}
.ti.a{background:var(--amber-soft);color:var(--amber)}
.ti svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2}
.go{color:var(--hint);font-size:18px;flex:none}
.funnel .r{display:grid;grid-template-columns:6.5em minmax(0,1fr) 2.5em;gap:10px;align-items:center;margin:9px 0}
.funnel .r span:last-child{text-align:right;font-weight:700}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px;min-width:0}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:1;height:44px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:16px;box-shadow:var(--shadow);outline:none}
.tools input:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--card);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.seg button.on{background:var(--ink);color:var(--bg)}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;cursor:pointer;padding:0 14px}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.del{background:transparent;color:var(--red);box-shadow:none}
.btn:disabled{opacity:.55}
.btn+.btn{margin-top:8px}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--acc);color:var(--acc-ink);font-size:30px;line-height:1;box-shadow:0 8px 22px rgba(255,90,54,.4);cursor:pointer;z-index:4}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:22px;padding:6px;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.14);border:1px solid var(--line)}
nav button{border:0;background:none;height:56px;border-radius:16px;font-size:11px;font-weight:600;color:var(--hint);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
nav button.on{color:var(--acc);background:var(--acc-soft)}
.empty{text-align:center;color:var(--hint);padding:36px 20px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:93vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:11;padding:8px 14px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sheet.open{transform:none}
.sheet-bg.open{display:block}
.sheet .in{max-width:640px;margin:0 auto}
.sheet h3{font-size:20px;font-weight:800;margin:2px 4px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;padding:8px 14px;border-radius:999px;flex:none}
.group{background:var(--card);border-radius:18px;padding:2px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.f{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.f:first-child{border-top:0}
.f label,.f .lb{font-size:14px;color:var(--hint);font-weight:500}
.f input,.f textarea{width:100%;border:0;background:transparent;font-size:16px;padding:6px 0;text-align:right;outline:none;font-weight:600}
.f textarea{text-align:left;min-height:64px;resize:vertical;font-weight:500}
.f.wide{grid-template-columns:1fr;gap:6px}
.f input:focus-visible,.f textarea:focus-visible{box-shadow:0 2px 0 var(--acc)}
.f input[type=date]{color-scheme:inherit}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pk button{border:0;border-radius:999px;padding:8px 13px;background:var(--line);font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.pk button.on{background:var(--ink);color:var(--bg)}
.pk-q{width:100%;border:0;background:var(--line);border-radius:10px;padding:8px 12px;font-size:15px;margin-bottom:8px;outline:none}
.sug{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.sug:empty{display:none}
.sug button{border:0;border-radius:999px;padding:6px 11px;background:var(--line);font-size:13px;cursor:pointer}
.sw{justify-self:end;position:relative;width:50px;height:30px}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:.15s}
.sw span::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::after{left:22px}
.calc{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.calc b{font-size:17px}
.calc.m b{color:var(--green)}
.pick{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.pick:first-child{border-top:0}
.pick input{width:22px;height:22px;flex:none;accent-color:var(--acc)}
pre.offer{white-space:pre-wrap;background:var(--card);border-radius:18px;padding:14px 16px;font-family:inherit;font-size:14px;line-height:1.5;margin:0 0 14px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.foot{text-align:center;margin-top:16px}
@media (prefers-reduced-motion:reduce){.sheet,.list .card{transition:none}}

/* ===== премиум: чёрный + золото ===== */
:root,:root[data-theme=dark],:root[data-theme=light]{
  --bg:#080808;--card:#121212;--ink:#efe9dd;--hint:#8a8378;--line:rgba(255,255,255,.07);
  --gold:#d6b46e;--gold2:#f1dba6;--gline:rgba(214,180,110,.22);
  --acc:#d6b46e;--acc-ink:#0b0a08;--acc-soft:rgba(214,180,110,.13);
  --green:#7cc59a;--green-soft:rgba(124,197,154,.12);--amber:#e0b35c;--amber-soft:rgba(224,179,92,.13);
  --red:#e7736f;--red-soft:rgba(231,115,111,.13);--blue:#c8ccd3;--blue-soft:rgba(200,204,211,.1);
  --hero:#0f0e0c;--hero-ink:#efe9dd;--hero-hint:#8a8378;--shadow:none;color-scheme:dark;
}
body{background:radial-gradient(120% 60% at 100% 0,rgba(214,180,110,.07),transparent 60%) fixed,var(--bg)}
.card,.kpi,.empty,.group,.tools input,pre.offer{border:1px solid var(--line)}
.logo{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0b0a08;border-radius:50%;font-weight:700;letter-spacing:.02em}
.top .t1{font-weight:600}
h1{font-weight:300;font-size:30px;letter-spacing:-.01em}
h1 .s{color:var(--gold)}
h2{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600;color:var(--hint)}
.hero{display:block;border:1px solid var(--gline);background:linear-gradient(160deg,#17150f 0%,#0c0c0b 55%);position:relative;overflow:hidden;padding:20px 20px 18px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(214,180,110,.16),transparent 70%);pointer-events:none}
.hero .lbl{text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--gold)}
.hero b{font-weight:300;font-size:clamp(34px,11vw,46px);margin:10px 0 16px;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.gl{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.gl .ln{flex:1;height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden}
.gl .ln i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));min-width:2px}
.gl span{font-size:13px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.kpi .ic{border:1px solid var(--gline);background:transparent!important;color:var(--gold)!important}
.kpi b{font-weight:300;font-size:30px}
.ti{background:transparent;border:1px solid var(--red-soft)}
.ti.a{background:transparent;border:1px solid var(--gline);color:var(--gold)}
.go{color:var(--gold)}
.bar{height:3px;background:rgba(255,255,255,.07)}
.bar i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.funnel .r span:last-child{font-weight:300;font-size:17px}
.av{background:transparent;border:1px solid rgba(200,204,211,.3);color:var(--blue);font-weight:600}
.av.food{background:transparent;border-color:var(--gline);color:var(--gold)}
.av.cl{border:1px solid var(--line);background:transparent;color:var(--ink)}
.chip{background:rgba(255,255,255,.05);font-weight:500}
.seg button{background:transparent;border:1px solid var(--line);color:var(--hint)}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#0b0a08}
.pk button{background:transparent;border:1px solid var(--line)}
.pk button.on{background:var(--gold);border-color:var(--gold);color:#0b0a08}
.btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0b0a08;letter-spacing:.02em}
.btn.sec{background:transparent;color:var(--gold);border:1px solid var(--gline)}
.btn.del{background:transparent}
.fab{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0b0a08;border-radius:50%;box-shadow:0 10px 30px rgba(214,180,110,.3);font-weight:300}
nav{background:rgba(14,14,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--gline);box-shadow:0 12px 40px rgba(0,0,0,.6)}
nav button.on{background:transparent;color:var(--gold)}
nav button.on::after{content:"";width:18px;height:2px;border-radius:1px;background:var(--gold);margin-top:1px}
.sheet{background:#0b0b0b;border-top:1px solid var(--gline)}
.sheet h3{font-weight:300;font-size:24px}
.x{background:transparent;border:1px solid var(--line)}
.calc b{font-weight:400}
.calc.m b{color:var(--gold)}
.sw input:checked+span{background:var(--gold)}
.sw span::after{background:#efe9dd}
.f input:focus-visible,.f textarea:focus-visible{box-shadow:0 1px 0 var(--gold)}
.tools input:focus-visible{box-shadow:0 0 0 1px var(--gold)}
.toast{background:var(--gold);color:#0b0a08}
.banner{border:1px solid var(--gline);background:rgba(214,180,110,.07)}
.banner.err{border-color:var(--red-soft);background:var(--red-soft)}
</style>
</head>
<body>
<main id="app"><div class="empty">Загрузка…</div></main>
<button class="fab" id="fab" aria-label="Добавить" hidden>+</button>
<nav id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button data-v="bloggers"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>Блогеры</button>
  <button data-v="clients"><svg viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14"/><path d="M9 21v-6h6v6"/></svg>Клиенты</button>
  <button data-v="deals"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M8 15h3"/></svg>Сделки</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
{
/* ================== НАСТРОЙКА ==================
   Вставьте сюда URL веб-приложения Google Apps Script (Deploy → Web app → URL).
   Пока пусто — приложение работает в демо-режиме с данными только на этом устройстве. */
const API_URL = 'https://script.google.com/macros/s/AKfycbx0y0xWsbim4h7jmE-BuhCOHw-_vt7h1gyPfHHorL6-umqJ9pmnbmDxQ8BVMElGxuUa/exec';

const tg = window.Telegram && window.Telegram.WebApp;
const LIVE = !!(API_URL && tg && tg.initData);
const NICHES = ['Одежда', 'Еда'];
const PLATFORMS = ['Instagram', 'Telegram', 'TikTok', 'YouTube'];
const B_STATUS = ['Новый', 'Проверен', 'В работе', 'Отказ', 'Чёрный список'];
const C_STATUS = ['Написали', 'Ответили', 'Созвон/встреча', 'Сделка', 'Отказ'];
const FORMATS = ['Сторис', 'Пост', 'Рилс', 'Пакет'];
const DEFAULT_SETTINGS = { id: 'main', markup: 30, fakeThreshold: 5, goal: 6000000 };

let data = { bloggers: [], clients: [], deals: [], settings: [] };
let view = 'home', me = null, loadError = '';
const ui = { bq: '', bn: 'Все', cq: '', cs: 'Активные', dq: '', ds: 'Все' };

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = v => { const x = Number(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isFinite(x) ? x : 0; };
const fmt = v => Math.round(n(v)).toLocaleString('ru-RU').replace(/,/g, ' ');
const sum = v => fmt(v) + ' сум';
const pct = v => (Math.round(v * 10) / 10).toLocaleString('ru-RU') + '%';
const yes = v => v === true || v === 'TRUE' || v === 'true' || v === 1 || v === 'Да';
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const ddmm = s => s ? String(s).slice(8, 10) + '.' + String(s).slice(5, 7) : '';
const settings = () => Object.assign({}, DEFAULT_SETTINGS, data.settings[0] || {});
const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---------- расчёты ---------- */
const reachPct = b => n(b.followers) ? n(b.storyReach) / n(b.followers) * 100 : null;
const fake = b => { const r = reachPct(b); return r != null && n(b.storyReach) > 0 && r < n(settings().fakeThreshold); };
const markupOf = d => d.markup === '' || d.markup == null ? n(settings().markup) : n(d.markup);
const price = d => n(d.cost) * (1 + markupOf(d) / 100);
const margin = d => price(d) - n(d.cost);
const overdue = c => c.nextDate && c.nextDate <= today() && !['Сделка', 'Отказ'].includes(c.status);
const bloggerName = id => { const b = data.bloggers.find(x => x.id === id); return b ? b.name : (id || '—'); };

  if (!j.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}

function demoSave() { try { localStorage.setItem(DEMO_KEY, JSON.stringify(demoDb)); } catch (e) {} }
async function demo(action, p) {
  if (!demoDb) demoDb = demoLoad();
  if (action === 'load') return { data: JSON.parse(JSON.stringify(demoDb)), me: { name: 'Демо' } };
  const list = demoDb[p.entity];
  if (action === 'save') {
    const r = Object.assign({}, p.record);
    if (p.entity === 'settings') r.id = 'main';
    if (!r.id) r.id = Math.random().toString(36).slice(2, 10);
    const i = list.findIndex(x => x.id === r.id);
    if (i >= 0) list[i] = r; else list.push(r);
    demoSave(); return { record: r };
  }
  if (action === 'delete') { const i = list.findIndex(x => x.id === p.id); if (i >= 0) list.splice(i, 1); demoSave(); return {}; }
}

function fieldHtml(f, v) {
  const id = 'f_' + f.k;
  if (f.t === 'calc') return `<div class="calc"><span class="s">Цена клиенту</span><b class="num" id="calcP"></b></div><div class="calc m"><span class="s">Ваша маржа</span><b class="num" id="calcM"></b></div>`;
  if (f.t === 'bool') return `<div class="f"><label for="${id}">${esc(f.l)}</label><span class="sw"><input type="checkbox" id="${id}" ${yes(v) ? 'checked' : ''}><span></span></span></div>`;
  if (f.t === 'area') return `<div class="f wide"><label for="${id}">${esc(f.l)}</label><textarea id="${id}">${esc(v)}</textarea></div>`;
  if (f.t === 'sel') {
    let opts = typeof f.o === 'function' ? f.o() : f.o;
    opts = opts.map(o => Array.isArray(o) ? o : [o, o]);
    if (f.free) return `<div class="f"><label for="${id}">${esc(f.l)}</label><input id="${id}" value="${esc(v)}" autocomplete="off" data-sug="${id}_s"><div class="sug" id="${id}_s"></div></div>`;
    if (v && !opts.some(o => String(o[0]) === String(v))) opts.unshift([v, v]);
    const q = opts.length > 8 ? `<input class="pk-q" placeholder="Найти" data-pkq="${id}">` : '';
    return `<div class="f wide"><span class="lb">${esc(f.l)}</span>${q}<input type="hidden" id="${id}" value="${esc(v)}"><div class="pk" data-pk="${id}">${opts.map(o => `<button type="button" data-v="${esc(o[0])}" class="${String(o[0]) === String(v) ? 'on' : ''}">${esc(o[1])}</button>`).join('')}</div></div>`;
  }
  const type = f.t === 'num' ? 'number' : f.t === 'date' ? 'date' : 'text';
  return `<div class="f"><label for="${id}">${esc(f.l)}</label><input id="${id}" type="${type}" ${f.t === 'num' ? 'inputmode="decimal" step="any"' : ''} value="${esc(v)}"></div>`;
}

function openForm(entity, rec) {
  const cfg = FORMS[entity];
  const isNew = !rec || !rec.id;
  rec = Object.assign({}, rec || {});
  if (isNew && entity === 'clients') { rec.firstDate = rec.firstDate || today(); rec.status = rec.status || 'Написали'; }
  if (isNew && entity === 'deals') { rec.date = rec.date || today(); rec.qty = rec.qty || 1; }
  if (isNew && entity === 'bloggers') rec.status = rec.status || 'Новый';
  const extra = entity === 'clients' && !isNew ? `<button class="btn sec" id="offerBtn" type="button">Собрать подборку блогеров для клиента</button>` : '';
  const del = !isNew && entity !== 'settings' ? `<button class="btn del" id="delBtn" type="button">Удалить</button>` : '';
  openSheet(`<h3>${isNew ? 'Новый: ' : ''}${esc(cfg.title)}<button class="x" data-close>Закрыть</button></h3>
    <form id="frm"><div class="group">${cfg.fields.map(f => fieldHtml(f, rec[f.k])).join('')}</div>
    <button class="btn" type="submit" id="saveBtn">Сохранить</button>${extra}${del}</form>
    ${rec.updatedBy ? `<p class="s" style="text-align:center">Изменил(а): ${esc(rec.updatedBy)}, ${esc(rec.updatedAt)}</p>` : ''}`);

  const read = () => {
    const out = Object.assign({}, rec);
    cfg.fields.forEach(f => {
      if (f.t === 'calc') return;
      const el = document.getElementById('f_' + f.k);
      out[f.k] = f.t === 'bool' ? el.checked : f.t === 'num' ? (el.value === '' ? '' : n(el.value)) : el.value.trim();
    });
    return out;
  };
  const recalc = () => { if (entity !== 'deals') return; const d = read(); $('#calcP').textContent = sum(price(d)); $('#calcM').textContent = sum(margin(d)); };
  recalc();
  $('#frm').addEventListener('input', recalc);
  if (entity === 'deals') $('#f_blogger').addEventListener('change', e => { const b = data.bloggers.find(x => x.id === e.target.value); if (b && !$('#f_niche').value) setPick('f_niche', b.niche || ''); });
  $('#frm').addEventListener('submit', async e => {
    e.preventDefault();
    const out = read();
    const miss = cfg.fields.find(f => f.req && !String(out[f.k]).trim());
    if (miss) { toast('Заполните: ' + miss.l); return; }
    if (entity === 'deals' && yes(out.published) && !yes(out.prepaid)) toast('Внимание: публикация вышла без предоплаты');
    const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = 'Сохраняю…';
    try {
      const r = await api('save', { entity, record: out });
      const list = data[entity]; const i = list.findIndex(x => x.id === r.record.id);
      if (i >= 0) list[i] = r.record; else list.push(r.record);
      haptic('success'); closeSheet(); render(); toast('Сохранено');
    } catch (err) { haptic('error'); toast(err.message); btn.disabled = false; btn.textContent = 'Сохранить'; }
  });
  const db = $('#delBtn');
  if (db) db.addEventListener('click', async () => {
    if (db.dataset.sure !== '1') { db.dataset.sure = '1'; db.textContent = 'Точно удалить? Нажмите ещё раз'; return; }
    db.disabled = true;
    try { await api('delete', { entity, id: rec.id }); data[entity] = data[entity].filter(x => x.id !== rec.id); closeSheet(); render(); toast('Удалено'); }
    catch (err) { toast(err.message); db.disabled = false; }
  });
  const ob = $('#offerBtn'); if (ob) ob.addEventListener('click', () => openOffer(rec));
}

/* ---------- подборка для клиента ---------- */
function openOffer(client) {
  const s = settings();
  const pool = data.bloggers.filter(b => (!client.niche || b.niche === client.niche) && b.status !== 'Отказ' && b.status !== 'Чёрный список')
    .sort((a, b) => (yes(b.verified) - yes(a.verified)) || n(b.storyReach || b.postReach) - n(a.storyReach || a.postReach));
  const k = 1 + n(s.markup) / 100;
  openSheet(`<h3>Подборка для «${esc(client.name)}»<button class="x" data-close>Закрыть</button></h3>
    <p class="s" style="margin:0 6px 8px">Цены уже с вашей наценкой ${esc(s.markup)}%. Блогеры без проверенной статистики помечены.</p>
    <div class="seg" id="ofmt"><button class="on" data-f="story">Сторис</button><button data-f="post">Пост / рилс</button></div>
    <div class="group" id="olist">${pool.length ? pool.map(b => `<label class="pick"><input type="checkbox" value="${esc(b.id)}" ${yes(b.verified) ? 'checked' : ''}>
      <span class="grow"><span class="t">${esc(b.name)}</span><br><span class="s">${esc(b.platform || '')} · ${fmt(b.followers)} подп. ${yes(b.verified) ? '' : '· <span style="color:var(--amber)">не проверен</span>'}</span></span></label>`).join('')
      : '<div class="empty">Нет блогеров в нише «' + esc(client.niche || '—') + '»</div>'}</div>
    <h2>Текст для клиента</h2><pre class="offer" id="otext"></pre>
    <button class="btn" id="oshare">Отправить в Telegram</button><button class="btn sec" id="ocopy">Скопировать</button>`);
  let f = 'story';
  const build = () => {
    const ids = [...document.querySelectorAll('#olist input:checked')].map(i => i.value);
    const sel = pool.filter(b => ids.includes(b.id));
    let total = 0, reach = 0;
    const lines = sel.map((b, i) => {
      const p = Math.round(n(f === 'story' ? b.priceStory : b.pricePost) * k / 1000) * 1000;
      const r = n(f === 'story' ? b.storyReach : b.postReach);
      total += p; reach += r;
      return `${i + 1}. ${b.name} (${b.platform || ''}) — ${fmt(b.followers)} подписчиков, охват ${f === 'story' ? 'сторис' : 'поста'} ~${fmt(r)}${b.cityPct ? ', ' + b.cityPct + '% аудитории из города' : ''} — ${sum(p)}`;
    });
    const txt = sel.length ? `Здравствуйте! Подобрали блогеров под ${client.niche === 'Еда' ? 'ваше заведение' : client.niche === 'Одежда' ? 'ваш магазин' : 'ваш бизнес'}:\n\n${lines.join('\n')}\n\nИтого: ${sum(total)} за ${sel.length} ${f === 'story' ? 'сторис' : 'публикаций'}, ожидаемый охват ~${fmt(reach)}.\nСами договариваемся с блогерами, контролируем выход и присылаем отчёт с охватами. Оплата до публикации.\n\nЗапускаем?` : 'Отметьте блогеров выше.';
    $('#otext').textContent = txt;
    return $('#otext').textContent;
  };
  build();
  $('#olist').addEventListener('change', build);
  $('#ofmt').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; f = b.dataset.f; document.querySelectorAll('#ofmt button').forEach(x => x.classList.toggle('on', x === b)); build(); });
  $('#ocopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(build()); toast('Скопировано'); } catch (e) { toast('Не удалось скопировать: выделите текст вручную'); } });
  $('#oshare').addEventListener('click', () => {
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(' ') + '&text=' + encodeURIComponent(build());
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
  });
}

function setPick(id, v) {
  const h = document.getElementById(id); if (!h) return;
  h.value = v;
  document.querySelectorAll(`[data-pk="${id}"] button`).forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
  h.dispatchEvent(new Event('change', { bubbles: true }));
  const frm = $('#frm'); if (frm) frm.dispatchEvent(new Event('input'));
}
function suggest(inp) {
  const box = document.getElementById(inp.dataset.sug); if (!box) return;
  const q = inp.value.trim().toLowerCase();
  const names = data.clients.map(c => c.name).filter(x => x && x.toLowerCase().includes(q) && x !== inp.value).slice(0, 6);
  box.innerHTML = names.map(x => `<button type="button" data-fill="${esc(inp.id)}">${esc(x)}</button>`).join('');
}

  data.deals.forEach(d => {
    if (yes(d.published) && !yes(d.prepaid)) todo.push({ i: 'money', e: 'deals', r: d, t: `Нет предоплаты: ${d.client}`, s: 'Публикация вышла, а денег нет' });
    if (yes(d.published) && !yes(d.bloggerPaid)) todo.push({ i: 'pay', e: 'deals', r: d, t: `Оплатить блогеру ${bloggerName(d.blogger)}`, s: `${d.client} · ${sum(d.cost)}`, a: 1 });
    if (yes(d.published) && !yes(d.reportSent)) todo.push({ i: 'doc', e: 'deals', r: d, t: `Отправить отчёт: ${d.client}`, s: 'Отчёт превращает разовую сделку в постоянного клиента', a: 1 });
  });
  const fakeN = data.bloggers.filter(b => fake(b) && b.status !== 'Отказ').length;
  if (fakeN) todo.push({ i: 'warn', go: 'bloggers', t: `Проверить ${fakeN} блогер(ов) на накрутку`, s: `Охват сторис ниже ${s.fakeThreshold}% от подписчиков`, a: 1 });
  const C = data.clients, cnt = st => C.filter(c => st.includes(c.status)).length;
  const fun = [['Написали', C.length], ['Ответили', cnt(['Ответили', 'Созвон/встреча', 'Сделка'])], ['Созвон', cnt(['Созвон/встреча', 'Сделка'])], ['Сделка', cnt(['Сделка'])]];
  const verified = data.bloggers.filter(b => yes(b.verified) && b.status !== 'Отказ' && b.status !== 'Чёрный список').length;
  home._todo = todo;
  const p = goal ? Math.min(1, mm / goal) : 0;
  const nm = me && me.name && me.name !== 'Демо' ? ', ' + String(me.name).split(' ')[0] : '';
  const dt = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  return `${banner()}<div class="top"><span class="logo">A</span><span><div class="t1">${esc(hello() + nm)}</div><div class="t2">${esc(dt)}</div></span></div>
  <div class="hero"><div class="lbl">Маржа · ${new Date().toLocaleString('ru-RU', { month: 'long' })}</div><b class="num">${sum(mm)}</b>
    <div class="gl"><div class="ln"><i style="width:${p * 100}%"></i></div><span>${Math.round(p * 100)}%</span></div>
    <div class="sub">${goal ? `Цель ${sum(goal)} · ${left ? (need != null ? `ещё ~${need} сделок по ${sum(avg)}` : 'нужна первая сделка для расчёта') : 'цель выполнена'}` : 'Задайте цель в настройках'}</div></div>
  <div class="kpis">
    <div class="kpi"><div class="ic" style="background:var(--green-soft);color:var(--green)">${IC.money}</div><b>${md.length}</b><span class="s">сделок · ${sum(rev)}</span></div>
    <div class="kpi"><div class="ic" style="background:var(--blue-soft);color:var(--blue)">${IC.user}</div><b>${verified}<span class="s" style="font-size:15px;font-weight:600"> / 10</span></b><span class="s">${verified < 10 ? 'проверенных блогеров' : 'можно продавать'}</span></div>
  </div>
  <h2>Сделать сейчас${todo.length ? ' · ' + todo.length : ''}</h2>
  <div class="card">${todo.length ? todo.map((x, i) => `<div class="todo" data-todo="${i}"><span class="ti ${x.a ? 'a' : ''}">${IC[x.i] || IC.warn}</span><span class="grow"><span class="t">${esc(x.t)}</span><br><span class="s">${esc(x.s)}</span></span><span class="go">›</span></div>`).join('') : '<div class="s">Всё сделано. Время писать новым клиентам.</div>'}</div>
  <h2>Воронка клиентов</h2>
  <div class="card funnel">${fun.map(([l, v]) => `<div class="r"><span class="s">${l}</span><div class="bar"><i style="width:${C.length ? v / C.length * 100 : 0}%"></i></div><span class="num">${v}</span></div>`).join('')}
    <div class="s" style="margin-top:10px">${C.length >= 30 ? `Конверсия в сделку: ${pct(fun[3][1] / C.length * 100)}` : `Конверсию считаем после 30 написанных клиентов (сейчас ${C.length}).`}</div></div>
  <div class="foot"><button class="btn sec" id="setBtn">Настройки: наценка, накрутка, цель</button></div>`;
}

function bloggers() {
  const q = ui.bq.toLowerCase();
  const list = data.bloggers.filter(b => (ui.bn === 'Все' || b.niche === ui.bn) && (!q || JSON.stringify(b).toLowerCase().includes(q)))
    .sort((a, b) => (yes(b.verified) - yes(a.verified)) || String(a.name).localeCompare(String(b.name)));
  return `${banner()}<h1>Блогеры <span class="s">${data.bloggers.length}</span></h1>
  <div class="tools"><input id="bq" placeholder="Поиск" value="${esc(ui.bq)}" type="search"></div>
  <div class="seg" id="bn">${['Все', ...NICHES].map(x => `<button class="${ui.bn === x ? 'on' : ''}" data-x="${x}">${x}</button>`).join('')}</div>
  <div class="list">${list.length ? list.map(b => { const r = reachPct(b); return `<div class="card" data-open="bloggers" data-id="${esc(b.id)}">${av(b.name, b.niche)}<div class="grow">
    <div class="row"><span class="t">${esc(b.name)}</span><span class="num s">${fmt(b.followers)} подп.</span></div>
    <div class="s">${esc([b.niche, b.platform, b.age].filter(Boolean).join(' · '))}</div>
    <div class="chips">${yes(b.verified) ? '<span class="chip ok">Статистика проверена</span>' : '<span class="chip warn">Без скринов</span>'}
      ${fake(b) ? '<span class="chip bad">Проверить накрутку</span>' : ''}
      ${r != null && n(b.storyReach) ? `<span class="chip">Сторис ${pct(r)}</span>` : ''}
      ${n(b.priceStory) ? `<span class="chip num">Сторис ${sum(b.priceStory)}</span>` : ''}
      ${n(b.pricePost) ? `<span class="chip num">Пост ${sum(b.pricePost)}</span>` : ''}
      ${b.status && b.status !== 'Проверен' ? `<span class="chip">${esc(b.status)}</span>` : ''}</div></div></div>`; }).join('')
    : `<div class="empty">${data.bloggers.length ? 'Ничего не найдено' : 'Добавьте первого блогера кнопкой «+». Без скриншотов статистики не отмечайте «проверен».'}</div>`}</div>`;
}

function clients() {
  const q = ui.cq.toLowerCase();
  const tabs = ['Активные', 'Касание сегодня', 'Сделка', 'Отказ', 'Все'];
  const list = data.clients.filter(c => {
    if (q && !JSON.stringify(c).toLowerCase().includes(q)) return false;
    if (ui.cs === 'Активные') return !['Сделка', 'Отказ'].includes(c.status);
    if (ui.cs === 'Касание сегодня') return overdue(c);
    if (ui.cs === 'Все') return true;
    return c.status === ui.cs;
  }).sort((a, b) => String(a.nextDate || '9999').localeCompare(String(b.nextDate || '9999')));
  return `${banner()}<h1>Клиенты <span class="s">${data.clients.length}</span></h1>
  <div class="tools"><input id="cq" placeholder="Поиск" value="${esc(ui.cq)}" type="search"></div>
  <div class="seg" id="cs">${tabs.map(x => `<button class="${ui.cs === x ? 'on' : ''}" data-x="${x}">${x}${x === 'Касание сегодня' ? ' ' + data.clients.filter(overdue).length : ''}</button>`).join('')}</div>
  <div class="list">${list.length ? list.map(c => `<div class="card" data-open="clients" data-id="${esc(c.id)}">${av(c.name, c.niche, 1)}<div class="grow">
    <div class="row"><span class="t">${esc(c.name)}</span><span class="s">${esc(c.niche || '')}</span></div>
    <div class="s">${esc([c.area, c.contact].filter(Boolean).join(' · '))}</div>
    <div class="chips"><span class="chip ${c.status === 'Сделка' ? 'ok' : c.status === 'Отказ' ? 'bad' : ''}">${esc(c.status || '—')}</span>
      ${c.nextDate && !['Сделка', 'Отказ'].includes(c.status) ? `<span class="chip ${overdue(c) ? 'bad' : ''}">Касание ${ddmm(c.nextDate)}</span>` : ''}
      ${c.pkg ? `<span class="chip">${esc(c.pkg)}</span>` : ''}</div></div></div>`).join('')
    : `<div class="empty">${data.clients.length ? 'Здесь пусто' : 'Добавляйте каждый бизнес, которому написали, и ставьте дату следующего касания.'}</div>`}</div>`;
}

function deals() {
  const q = ui.dq.toLowerCase();
  const tabs = ['Все', 'Ждут предоплату', 'Блогеру не оплачено', 'Без отчёта'];
  const list = data.deals.filter(d => {
    if (q && !(JSON.stringify(d) + bloggerName(d.blogger)).toLowerCase().includes(q)) return false;
    if (ui.ds === 'Ждут предоплату') return !yes(d.prepaid);
    if (ui.ds === 'Блогеру не оплачено') return yes(d.published) && !yes(d.bloggerPaid);
    if (ui.ds === 'Без отчёта') return yes(d.published) && !yes(d.reportSent);
    return true;
  }).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const tot = data.deals.reduce((a, d) => a + margin(d), 0);
  return `${banner()}<h1>Сделки <span class="s">${data.deals.length} · маржа ${sum(tot)}</span></h1>
  <div class="tools"><input id="dq" placeholder="Поиск" value="${esc(ui.dq)}" type="search"></div>
  <div class="seg" id="ds">${tabs.map(x => `<button class="${ui.ds === x ? 'on' : ''}" data-x="${x}">${x}</button>`).join('')}</div>
  <div class="list">${list.length ? list.map(d => `<div class="card" data-open="deals" data-id="${esc(d.id)}"><div class="grow">
    <div class="row"><span class="t">${esc(d.client)}</span><span class="num t" style="color:var(--green)">+${sum(margin(d))}</span></div>
    <div class="s">${ddmm(d.date)} · ${esc(bloggerName(d.blogger))} · ${esc(d.qty || 1)} × ${esc(d.format || '')} · клиенту ${sum(price(d))}</div>
    <div class="chips">
      <span class="chip ${yes(d.prepaid) ? 'ok' : yes(d.published) ? 'bad' : 'warn'}">${yes(d.prepaid) ? 'Предоплата есть' : 'Нет предоплаты'}</span>
      <span class="chip ${yes(d.published) ? 'ok' : ''}">${yes(d.published) ? 'Вышла' : 'Не вышла'}</span>
      ${yes(d.published) ? `<span class="chip ${yes(d.bloggerPaid) ? 'ok' : 'warn'}">${yes(d.bloggerPaid) ? 'Блогеру оплачено' : 'Блогеру не оплачено'}</span>
      <span class="chip ${yes(d.reportSent) ? 'ok' : 'warn'}">${yes(d.reportSent) ? 'Отчёт отправлен' : 'Нет отчёта'}</span>` : ''}
      ${n(d.reach) ? `<span class="chip num">Охват ${fmt(d.reach)}</span>` : ''}</div></div></div>`).join('')
    : `<div class="empty">${data.deals.length ? 'Здесь пусто' : 'Первая сделка — главная цель. Правило: клиент платит до публикации, блогер получает после.'}</div>`}</div>`;
}

const VIEWS = { home, bloggers, clients, deals };
function render() {
  const y = window.scrollY;
  const active = document.activeElement && document.activeElement.id;
  $('#app').innerHTML = VIEWS[view]();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#fab').hidden = view === 'home';
  if (active && ['bq', 'cq', 'dq'].includes(active)) { const el = document.getElementById(active); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  window.scrollTo(0, y);
}

/* ---------- события ---------- */
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; window.scrollTo(0, 0); render(); });
$('#fab').addEventListener('click', () => openForm(view));
$('#app').addEventListener('click', e => {
  const c = e.target.closest('[data-open]');
  if (c) { const r = data[c.dataset.open].find(x => x.id === c.dataset.id); openForm(c.dataset.open, r); return; }
  const t = e.target.closest('[data-todo]');
  if (t) { const x = home._todo[+t.dataset.todo]; if (x.go) { view = x.go; render(); } else openForm(x.e, x.r); return; }
  const seg = e.target.closest('.seg button');
  if (seg) { const key = { bn: 'bn', cs: 'cs', ds: 'ds' }[seg.parentElement.id]; ui[key] = seg.dataset.x; render(); return; }
  if (e.target.id === 'setBtn') openForm('settings', settings());
});
$('#app').addEventListener('input', e => { if (['bq', 'cq', 'dq'].includes(e.target.id)) { ui[e.target.id] = e.target.value; render(); } });

/* ---------- старт ---------- */
(async () => {
  const theme = () => {
    let dark = false;
    try { dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    document.documentElement.dataset.theme = 'dark';
    try { const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); tg && tg.setHeaderColor && tg.setHeaderColor(bg); tg && tg.setBackgroundColor && tg.setBackgroundColor(bg); } catch (e) {}
  };
  theme();
  if (tg) { try { tg.ready(); tg.expand(); tg.onEvent && tg.onEvent('themeChanged', theme); } catch (e) {} }
  try {
    const r = await api('load');
    data = Object.assign({ bloggers: [], clients: [], deals: [], settings: [] }, r.data);
    me = r.me;
  } catch (err) { loadError = err.message; }
  render();
})();
}
</script>
</body>
</html>
